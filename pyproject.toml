[project]
name = "stable-challenge-image"
version = "0.1.0"
description = "Self-supervised image pretraining challenge with a CPU-only ONNX evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3",
  "numpy",
  "pillow",
  "onnx",
  "onnxruntime",
  "torch==2.14.1",
  "torchvision==0.29.1",
]

[dependency-groups]
baseline = ["stable-pretraining==0.1.8", "kornia", "timm>=1.0.30", "lightning>=2.5", "wandb>=0.30.0"]
dev = ["pytest"]

[tool.uv]
package = false
default-groups = ["baseline", "dev"]

# Oscar's reported driver supports CUDA 12.x. PyPI's Linux torch wheel uses
# CUDA 13, so select the official CUDA 12.6 builds on Oscar's x86-64 nodes.
[tool.uv.sources]
torch = { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }
torchvision = { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
