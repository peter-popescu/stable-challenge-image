[project]
name = "stable-challenge-image"
version = "0.1.0"
description = "Self-supervised image pretraining challenge with a CPU-only ONNX evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "datasets>=3",
  "numpy",
  "pillow",
  "onnx",
  "onnxruntime",
  "torch",
  "torchvision",
]

[dependency-groups]
baseline = ["stable-pretraining==0.1.8", "kornia", "timm>=1.0.30", "lightning>=2.5", "wandb>=0.30.0"]
dev = ["pytest"]

[tool.uv]
package = false
default-groups = ["baseline", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
